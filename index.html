<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Local.co</title>
<meta name="description" content="Experiencias locales y comunitarias en Colombia. Proyecto Kit 8 · Usabilidad · HumanLab.">
<meta name="theme-color" content="#0E1530">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Local.co">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F4F5F8; --card:#FFFFFF; --ink:#14151A; --muted:#6B6F7B; --line:#E4E6EC;
  --blue:#3F6FDB; --navy:#0E1530; --yellow:#F2C230; --red:#D3263A; --green:#1F7A4A;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --font:"Poppins","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--navy)}
body{font-family:var(--font);font-size:14px;line-height:1.5;color:var(--ink);overscroll-behavior:none}
button{font:inherit;color:inherit}
#app{position:fixed;top:0;left:0;right:0;bottom:0;height:var(--appH,auto);max-width:480px;margin:0 auto;background:var(--navy);overflow:hidden;isolation:isolate}
@media (min-width:520px){
  html,body{background:#0A0A0E}
  body{display:grid;place-items:center;padding:20px}
  #app{position:relative;inset:auto;height:min(860px,calc(100vh - 40px));width:420px;border-radius:40px;box-shadow:0 0 0 10px #050507,0 0 0 11px #2c2d36,0 30px 80px rgba(0,0,0,.6)}
}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding:calc(var(--st) + 10px) 18px calc(max(8px, calc(var(--sb) - var(--gap, 0px))) + 80px);display:flex;flex-direction:column;gap:14px;background:var(--bg)}
.screen::-webkit-scrollbar{display:none}
.screen>*{flex-shrink:0}
.screen.nodock{padding-bottom:0}
.screen.enter{animation:enter .34s cubic-bezier(.2,.8,.2,1) both}
.screen.enter.back{animation-name:enterBack}
.screen.leave{animation:leave .28s ease both;pointer-events:none}
.screen.zoom{animation:zoomIn .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{from{transform:translateX(36px);opacity:0}to{transform:none;opacity:1}}
@keyframes enterBack{from{transform:translateX(-36px);opacity:0}to{transform:none;opacity:1}}
@keyframes leave{to{opacity:0;transform:scale(.97)}}
@keyframes zoomIn{from{clip-path:inset(30% 10% 40% 10% round 24px);opacity:.6}to{clip-path:inset(0 0 0 0 round 0);opacity:1}}

.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.h{font-size:24px;font-weight:600;line-height:1.15;margin:0;letter-spacing:-.01em;text-wrap:balance}
.h span{color:var(--muted);font-weight:400}
.h2{font-size:16px;font-weight:600;margin:0}
.small{font-size:12px;color:var(--muted)}
.label{font-size:12px;color:var(--muted);margin-bottom:6px}
.btn{border:0;font-weight:600;font-size:15px;border-radius:16px;padding:14px 16px;cursor:pointer;background:var(--ink);color:#fff;width:100%;transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.blue{background:var(--blue)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:.45}
.link{background:none;border:0;color:var(--blue);font-weight:600;font-size:13px;cursor:pointer;padding:4px}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.chip{border:1px solid var(--line);background:var(--card);font-size:13px;padding:8px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:.2s}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.y.on{background:var(--yellow);color:#1a1a1a;border-color:var(--yellow)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-18px;padding-inline:18px}
.chips::-webkit-scrollbar{display:none}
.wrapchips{display:flex;gap:8px;flex-wrap:wrap}
.icon-btn{width:40px;height:40px;border-radius:13px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;flex:none}
.card{background:var(--card);border-radius:18px;padding:14px;border:1px solid var(--line)}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:0 12px;transition:.2s}
.search:focus-within{border-color:var(--blue);box-shadow:0 0 0 4px rgba(63,111,219,.14)}
.search input,.search textarea{border:0;outline:0;background:none;font:inherit;font-size:14px;padding:12px 0;width:100%;color:var(--ink);resize:none}
.avatar{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-weight:600;font-size:14px;color:#fff;flex:none}
.badge{font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--yellow);color:#1a1a1a;white-space:nowrap}
.badge.g{background:#E3F4EA;color:var(--green)}
.badge.b{background:#E6EDFC;color:#2550B5}
.stars{color:#C98F00;font-size:12px;font-weight:600}
.tnum{font-variant-numeric:tabular-nums}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px}
.topbar .title{font-weight:600;font-size:15px;text-align:center;flex:1}

/* tabbar */
.tabbar{position:absolute;left:0;right:0;bottom:0;background:var(--navy);border-radius:24px 24px 0 0;padding:8px 10px max(8px, calc(var(--sb) - var(--gap, 0px)));display:flex;justify-content:space-between;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .3s}
.tabbar.hide{transform:translateY(160%)}
.tabbar button{flex:1;height:50px;border-radius:16px;border:0;background:none;color:#8C8F9C;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font-size:10px;position:relative}
.tabbar button.on{background:var(--blue);color:#fff}
.tabbar .dot{position:absolute;top:8px;right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;background:var(--yellow)}

/* modos de pantalla (ver Perfil) */
html.sm-b,html.sm-b body,html.sm-c,html.sm-c body{height:auto;min-height:100%;overflow:hidden}
html.sm-b #app{position:absolute;top:0;left:0;right:0;bottom:auto;height:100lvh}
html.sm-c #app{position:absolute;top:0;left:0;right:0;bottom:auto;height:var(--scrH,100vh)}

/* componentes: botones, stepper, menú contextual */
.btn.danger{background:var(--red)}
.btn.outline{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.stepbar{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.stepbar i{flex:1;height:2px;background:var(--line);border-radius:2px;min-width:8px}
.stepbar .st{display:flex;align-items:center;gap:6px;white-space:nowrap}
.stepbar .st span{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:11px;background:var(--card);border:1.5px solid var(--line);color:var(--muted)}
.stepbar .st.done span{background:var(--green);border-color:var(--green);color:#fff}
.stepbar .st.cur{color:var(--ink);font-weight:600}
.stepbar .st.cur span{background:var(--blue);border-color:var(--blue);color:#fff}
.ticket{position:relative}
.kebab{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:12px;border:0;background:rgba(255,255,255,.94);display:grid;place-items:center;cursor:pointer;z-index:3;color:var(--ink)}
.ctx{position:absolute;top:52px;right:10px;z-index:4;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 34px rgba(20,21,26,.2);padding:6px;min-width:210px;display:flex;flex-direction:column;animation:pop .18s both}
.ctx button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:10px;border-radius:10px;font-size:13.5px;cursor:pointer;text-align:left;color:var(--ink)}
.ctx button:active{background:var(--bg)}
.ctx hr{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
.ctx .danger{color:var(--red)}
.rcard.rbanner{flex:none;width:100%;height:150px;cursor:default}

/* fotos y regiones */
.ph{width:100%;height:100%;object-fit:cover;display:block}
.regions{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin-inline:-18px;padding-inline:18px;scroll-snap-type:x mandatory}
.regions::-webkit-scrollbar{display:none}
.rcard{flex:0 0 64%;height:190px;border-radius:20px;overflow:hidden;position:relative;border:0;padding:0;cursor:pointer;scroll-snap-align:start;color:#fff;text-align:left;background:var(--navy)}
.rcard img{position:absolute;inset:0}
.rcard::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(10,12,30,0) 35%,rgba(10,12,30,.85))}
.rcard div{position:absolute;left:14px;right:14px;bottom:12px;z-index:1;display:flex;flex-direction:column;gap:2px}
.rcard b{font-size:18px;font-weight:600}
.rcard span{font-size:11.5px;opacity:.9;line-height:1.35}
.rhead{display:flex;flex-direction:column;gap:0;margin-top:4px}
.rhead h3{margin:0;font-size:16px;font-weight:600}
.credits{display:flex;flex-direction:column;gap:6px;font-size:11px;color:var(--muted)}
.credits a{color:var(--blue)}

/* barra de estado y bandera */
.sbar{position:absolute;top:0;left:0;right:0;height:var(--st);background:var(--navy);z-index:55;pointer-events:none}
.flagbar{display:flex;height:5px;border-radius:5px;overflow:hidden}
.flagbar i{flex:2;background:var(--yellow)}.flagbar i+i{flex:1;background:var(--blue)}.flagbar i+i+i{background:var(--red)}
.homehero{margin:calc(-1 * (var(--st) + 10px)) -18px 0;padding:calc(var(--st) + 12px) 18px 20px;background:var(--navy);color:#fff;border-radius:0 0 28px 28px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:14px}
.homehero>*{position:relative}
.homehero .colmap{position:absolute;right:-26px;top:calc(var(--st) + 64px);width:128px;height:auto;opacity:.95}
.homehero .small{color:#AFB8D6}
.homehero .h{color:#fff;max-width:66%}
.homehero .h span{color:#AFB8D6}
.homehero .icon-btn{background:rgba(255,255,255,.12);border:0;color:#fff}
.homehero .search{border-color:transparent;color:var(--ink)}
.homehero .flagbar{margin:2px -18px -20px;border-radius:0;height:6px}

/* splash */
.splash{background:var(--navy);color:#fff;align-items:center;justify-content:center;text-align:center;padding:40px 24px}
.splash .outline{stroke-dasharray:640;stroke-dashoffset:640;animation:draw 1.5s .1s ease forwards}
.splash .fill{opacity:0;animation:fadeIn2 .7s 1.2s ease forwards}
.splash .route{stroke-dasharray:80;stroke-dashoffset:80;animation:draw .7s 1.6s ease forwards}
@keyframes fadeIn2{to{opacity:1}}
.splash .pin{transform-origin:center bottom;transform-box:fill-box;opacity:0;animation:drop .5s 2.2s cubic-bezier(.3,1.6,.5,1) forwards}
.splash .brand{opacity:0;animation:fadeUp .6s 2.3s forwards}
.brand h1{font-size:32px;font-weight:600;margin:14px 0 4px}
.brand h1 b{color:var(--yellow)}
.brand p{margin:0;color:#AFB8D6;font-size:13px}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes drop{from{opacity:0;transform:translateY(-20px) scale(.6)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* cards */
.plans{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{background:var(--card);border-radius:18px;padding:8px;border:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;gap:5px;text-align:left;animation:pop .35s both;transition:transform .2s}
.pcard:active{transform:scale(.98)}
.art{position:relative;border-radius:13px;overflow:hidden;aspect-ratio:1/1;max-width:100%}
.art svg{width:100%;height:100%;display:block}
.art .badge{position:absolute;left:6px;top:6px}
.heart{position:absolute;right:6px;top:6px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.92);border:0;display:grid;place-items:center;cursor:pointer}
.heart.on{color:var(--red)}
.heart.on svg{animation:beat .4s}
@keyframes beat{40%{transform:scale(1.4)}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}}
.pcard h3{margin:0;font-size:13px;font-weight:600;line-height:1.25}
.pcard .meta{font-size:11px;color:var(--muted)}
.pcard .price{font-size:13.5px;font-weight:600}
.pcard .price small{font-weight:400;color:var(--muted);font-size:10.5px}
.pcard .free{font-size:10.5px;color:var(--green);font-weight:500}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);font-size:13px;padding:28px 10px;display:flex;flex-direction:column;gap:10px;align-items:center}
.hscroll{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin-inline:-18px;padding-inline:18px;scroll-snap-type:x mandatory}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .pcard{flex:0 0 44%;scroll-snap-align:start}

/* detail */
.hero{margin:calc(-1 * (var(--st) + 10px)) -18px 0;height:calc(280px + var(--st));position:relative;flex:none}
.hero svg{width:100%;height:100%;display:block}
.hero::before{content:"";position:absolute;inset:0 0 auto;height:calc(var(--st) + 70px);background:linear-gradient(rgba(14,21,48,.55),rgba(14,21,48,0));z-index:1;pointer-events:none}
.hero .bar{z-index:2;position:absolute;top:calc(var(--st) + 12px);left:14px;right:14px;display:flex;justify-content:space-between}
.hero .bar .icon-btn{background:rgba(255,255,255,.92);border:0}
.sheet{background:var(--bg);border-radius:26px 26px 0 0;margin:-30px -18px 0;padding:18px 18px 0;position:relative;display:flex;flex-direction:column;gap:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:8px 10px}
.stats b{display:block;font-size:13px;font-weight:600}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;position:relative}
.seg button{position:relative;z-index:1;border:0;background:none;font-size:13px;padding:9px 0;cursor:pointer;transition:color .25s}
.seg button.on{color:#fff}
.seg .thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);background:var(--blue);border-radius:10px;transition:transform .3s cubic-bezier(.3,1.3,.5,1)}
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;margin-inline:-18px;padding-inline:18px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:8px 0 10px;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);font-weight:600;border-color:var(--blue)}
.tabpane{font-size:13px;color:#3B3E48;display:flex;flex-direction:column;gap:8px;animation:pop .25s both}
.tabpane ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.review{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.review p{margin:4px 0 0}
.host{display:flex;gap:12px;align-items:center}
.verified{font-size:11px;color:var(--green);font-weight:600}
.dock{position:sticky;bottom:0;margin:auto -18px 0;padding:14px 16px max(10px, calc(var(--sb) - var(--gap, 0px) - 8px));background:linear-gradient(to top,var(--bg) 75%,rgba(244,245,248,0));display:flex;flex-direction:column;gap:8px;z-index:20}
.stepper{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 8px;flex:none}
.stepper button{width:30px;height:30px;border-radius:9px;border:0;background:var(--bg);cursor:pointer;font-weight:600;font-size:16px}
.stepper span{min-width:46px;text-align:center;font-size:13px;font-weight:600}
.tick{display:inline-block;animation:tick .3s}
@keyframes tick{from{transform:translateY(-6px);opacity:.2}}

/* sheet overlay */
.scrim{position:absolute;inset:0;background:rgba(10,10,14,.45);z-index:60;display:flex;align-items:flex-end;animation:fade .25s both}
@keyframes fade{from{opacity:0}}
.bsheet{background:var(--bg);width:100%;border-radius:28px 28px 0 0;padding:10px 18px calc(var(--sb) + 22px);display:flex;flex-direction:column;gap:12px;animation:up .35s cubic-bezier(.2,.8,.2,1) both;max-height:90%;overflow:auto}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:40px;height:4px;border-radius:4px;background:#C9CCD6;margin:0 auto 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.err{font-size:12px;color:var(--red);margin-top:-6px}

/* chat */
.bubble{max-width:80%;padding:10px 13px;border-radius:17px;font-size:13.5px;line-height:1.4;animation:pop .3s both}
.bubble.me{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:5px}
.bubble.them{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
.typing{display:flex;gap:4px;padding:13px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:.2}}

/* checkout */
.pay{display:flex;align-items:center;gap:10px;padding:12px;border-radius:15px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;text-align:left;width:100%}
.pay.on{border-color:var(--blue)}
.pay .radio{margin-left:auto;width:20px;height:20px;border-radius:50%;border:2px solid var(--line);transition:.2s;flex:none}
.pay.on .radio{border:6px solid var(--blue)}
.pay .logo{width:34px;height:24px;border-radius:6px;display:grid;place-items:center;font-size:9px;font-weight:700;color:#fff;flex:none}
.lines{display:flex;flex-direction:column;gap:7px;font-size:13px}
.lines .between span:first-child{color:var(--muted)}
.lines .total{border-top:1px dashed var(--line);padding-top:9px;font-weight:600;font-size:15px}
.lines .total span:first-child{color:var(--ink)}
.notice{background:#FFF7D6;border:1px solid #F3DC85;border-radius:13px;padding:9px 11px;font-size:12.5px;display:flex;gap:9px;align-items:center}
.notice.g{background:#E9F6EF;border-color:#BFE3CE}

/* loading/success */
.center{align-items:center;justify-content:center;text-align:center}
.bus{animation:drive 1.4s ease-in-out infinite}
@keyframes drive{50%{transform:translateX(8px)}}
.dots::after{content:"";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.check circle{stroke-dasharray:190;stroke-dashoffset:190;animation:draw .6s ease forwards}
.check path{stroke-dasharray:60;stroke-dashoffset:60;animation:draw .35s .5s ease forwards}
.ticket{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;width:100%;text-align:left}
.ticket .band{height:84px}
.ticket .band svg{width:100%;height:100%;display:block}
.ticket .body{padding:14px;display:flex;flex-direction:column;gap:6px}
.ticket .cut{border-top:2px dashed var(--line);margin:4px -14px;position:relative}
.qr{width:120px;height:120px;image-rendering:pixelated;border-radius:8px;align-self:center}
.timeline{display:flex;flex-direction:column;font-size:12.5px}
.timeline div{display:grid;grid-template-columns:16px 1fr;gap:10px;padding-bottom:12px;position:relative}
.timeline div::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--line);margin-top:5px}
.timeline div.done::before{background:var(--blue)}
.timeline div::after{content:"";position:absolute;left:4px;top:17px;bottom:0;width:2px;background:var(--line)}
.timeline div:last-child::after{display:none}
.bigstars{display:flex;gap:6px;justify-content:center}
.bigstars button{border:0;background:none;cursor:pointer;color:#D5D8E0;padding:2px}
.bigstars button.on{color:#F2B400}
.bigstars button.on svg{animation:beat .35s}
.toast{position:absolute;left:16px;right:16px;bottom:calc(max(8px, calc(var(--sb) - var(--gap, 0px))) + 72px);background:var(--ink);color:#fff;border-radius:15px;padding:12px 14px;font-size:13px;z-index:70;animation:up .3s both}

/* compare */
.cmp{display:flex;flex-direction:column;gap:10px}
.cmp .item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.cmp .item h4{margin:0;font-size:13px;font-weight:600}

------------------------------------------------------------------ */
const screens = document.getElementById("screens");
const tabbar = document.getElementById("tabbar");
const TAB_SCREENS = ["home","discover","trips","saved","profile"];
let timer = null;

function render(name, mode){
  S.screen = name;
  const old = screens.querySelector(".screen:not(.leave)");
  const h = document.createElement("div"); h.innerHTML = R[name]().trim();
  const el = h.firstElementChild;
  if(mode==="zoom") el.classList.add("zoom");
  else if(mode==="enter"||mode==="back"){ el.classList.add("enter"); if(mode==="back") el.classList.add("back"); }
  screens.appendChild(el);
  if(old){ if(mode==="none") old.remove(); else { old.classList.add("leave"); setTimeout(()=>old.remove(),300); } }
  document.querySelectorAll(".scrim").forEach(n=>n.remove());
  tabbar.classList.toggle("hide", !TAB_SCREENS.includes(name));
  tabbar.querySelectorAll("button").forEach(b=>b.classList.toggle("on", b.dataset.v===name));
  const tb = tabbar.querySelector('[data-v="trips"]'); const pend = S.trips.some(t=>!t.rated);
  if(pend && !tb.querySelector(".dot")) tb.insertAdjacentHTML("beforeend",'<i class="dot"></i>'); if(!pend) tb.querySelector(".dot")?.remove();
  document.querySelector(".sbar").style.opacity = name==="detail" ? 0 : 1;
  document.documentElement.style.background = (TAB_SCREENS.includes(name) || name==="splash") ? "#0E1530" : "#F4F5F8";
  drawQRs(el);
}
function go(name, opts={}){
  clearTimeout(timer);
  if(S.screen && S.screen!==name && !["loading","splash"].includes(S.screen)) S.stack.push(S.screen);
  render(name, opts.mode || "enter");
}
function back(fallback){
  let prev = S.stack.pop();
  while(prev && ["loading","success"].includes(prev)) prev = S.stack.pop();
  render(prev || fallback || "home", "back");
}
function rerender(){
  const cur = screens.querySelector(".screen:not(.leave)"); const st = cur ? cur.scrollTop : 0;
  const active = document.activeElement && document.activeElement.id;
  render(S.screen, "none");
  const n = screens.querySelector(".screen"); if(n) n.scrollTop = st;
  if(active){ const f = document.getElementById(active); if(f){ f.focus(); if(f.setSelectionRange && f.value!==undefined) try{ f.setSelectionRange(f.value.length,f.value.length);}catch(e){} } }
}
function toast(msg){
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const t = document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); t.textContent = msg;
  document.getElementById("app").appendChild(t); setTimeout(()=>t.remove(), 2800);
}

/* Código de reserva dibujado (no es un QR real) */
function drawQRs(root){
  root.querySelectorAll("canvas.qr").forEach(cv=>{
    const ctx = cv.getContext("2d"), code = cv.dataset.code; let seed = [...code].reduce((a,c)=>a*31+c.charCodeAt(0),7)>>>0;
    const rnd = () => (seed = (seed*1664525+1013904223)>>>0) / 4294967296;
    ctx.fillStyle="#fff"; ctx.fillRect(0,0,25,25); ctx.fillStyle="#14151A";
    for(let y=0;y<25;y++) for(let x=0;x<25;x++) if(rnd()>.52) ctx.fillRect(x,y,1,1);
    const finder=(x,y)=>{ctx.fillStyle="#14151A";ctx.fillRect(x,y,7,7);ctx.fillStyle="#fff";ctx.fillRect(x+1,y+1,5,5);ctx.fillStyle="#14151A";ctx.fillRect(x+2,y+2,3,3);ctx.fillStyle="#fff";};
    [[0,0],[18,0],[0,18]].forEach(([x,y])=>{ctx.fillStyle="#fff";ctx.fillRect(x-(x?1:0),y-(y?1:0),8,8);finder(x,y);});
  });
}

function sendMsg(t){

/* iPhone instalado: usar el alto real de la pantalla (iOS recorta el alto en modo app) */
/* iOS 26.0 recorta la vista de la app instalada: la franja que sobra abajo ya sirve de zona segura,
   así que medimos ese recorte (--gap) y lo descontamos del margen inferior. */
/* Modo de pantalla elegido en Perfil: a = vista que da iOS, b = 100lvh, c = alto real de la pantalla */
var SCREEN_MODE = (()=>{
  const iosApp = /iPhone|iPod/.test(navigator.userAgent) && (navigator.standalone || matchMedia("(display-mode: standalone)").matches);
  const def = iosApp ? "b" : "a"; /* en iPhone instalado el modo 2 (100lvh) llena toda la pantalla */
  try{ return localStorage.getItem("localco:smode") || def; }catch(e){ return def; }
})();
function screenProbe(){
  const d=document.createElement("div"); d.style.cssText="position:fixed;top:0;left:0;width:1px;visibility:hidden;pointer-events:none";
  const m=v=>{ d.style.height=v; document.body.appendChild(d); const h=Math.round(d.getBoundingClientRect().height); d.remove(); return h; };
  return "lvh "+m("100lvh")+" · svh "+m("100svh")+" · outer "+outerHeight+" · sb "+(getComputedStyle(document.documentElement).getPropertyValue("--gap")||"0").trim()+" · modo "+({a:1,b:2,c:3}[SCREEN_MODE]);
}
function applyScreenMode(){
  const r=document.documentElement; r.classList.remove("sm-b","sm-c"); if(SCREEN_MODE!=="a") r.classList.add("sm-"+SCREEN_MODE);
  r.style.setProperty("--scrH", (matchMedia("(orientation: portrait)").matches ? screen.height : screen.width) + "px");
}
function fitScreen(){
  applyScreenMode();
  const ios = /iPhone|iPod/.test(navigator.userAgent);
  const standalone = navigator.standalone || matchMedia("(display-mode: standalone)").matches;
  let gap = 0;
  if(ios && standalone && SCREEN_MODE==="a"){
    const full = matchMedia("(orientation: portrait)").matches ? screen.height : screen.width;
    gap = full - innerHeight; if(gap < 20) gap = 0;
  }
  document.documentElement.style.setProperty("--gap", gap + "px");
}
fitScreen(); addEventListener("resize", fitScreen); addEventListener("orientationchange", ()=>setTimeout(fitScreen,300));
